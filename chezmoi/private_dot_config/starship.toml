# Starship prompt config

# Timeout for commands (ms)
command_timeout = 1000

# Newline between prompts
add_newline = true

# Prompt format
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$swift\
$python\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

[username]
show_always = false
style_user = "cyan bold"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "green bold"
format = "in [$hostname]($style) "

[directory]
truncation_length = 3
truncate_to_repo = true
style = "blue bold"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
style = "purple bold"
format = "on [$symbol$branch]($style) "

[git_status]
style = "red bold"
format = '([$all_status$ahead_behind]($style) )'

[nodejs]
format = "[$symbol($version)]($style) "
symbol = " "

[swift]
format = "[$symbol($version)]($style) "
symbol = " "

[python]
format = "[$symbol($version)]($style) "

[rust]
format = "[$symbol($version)]($style) "

[golang]
format = "[$symbol($version)]($style) "

[cmd_duration]
min_time = 2000
style = "yellow bold"
format = "took [$duration]($style) "

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

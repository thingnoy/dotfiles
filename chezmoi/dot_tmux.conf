# Allow rename from shell hook only
set-option -g allow-rename on
set-window-option -g automatic-rename off

# --- session persistence across reboot (added 2026-07-14) ---
# backup of previous config: ~/.tmux.conf.bak.2026-07-14
#
# iTerm2 spawns `tmux -CC new-session -As hotkey` directly (no login shell),
# so the server inherits a bare macOS PATH without /opt/homebrew/bin.
# tpm/resurrect/continuum scripts all call bare `tmux` -> "command not found".
# This line must come BEFORE `run tpm`.
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# restore whatever each pane was running, not just resurrect's default whitelist.
# Commands are replayed verbatim: a pane running `claude --continue ...` resumes,
# a pane running a fresh `claude` comes back fresh.
#
# Do NOT force --continue here. `claude --continue` means "resume the newest
# conversation in this directory", not "resume what this pane was doing" — so a
# pane holding a brand-new empty claude would come back attached to a days-old
# conversation instead (hit 2026-07-14: a fresh pane resumed a 12 Jul session).
set -g @resurrect-processes ':all:'

# ...and per-pane resume is handled at save time instead (added 2026-08-12):
# this hook rewrites the just-saved file, appending `--resume <id>` to each
# claude pane using the map that ~/.claude/hooks/tmux-pane-session.sh stamps.
# post-save-layout runs before resurrect's files_differ/`last` symlink step and
# gets the file path as $1, so the rewrite is what actually gets linked.
set -g @resurrect-hook-post-save-layout '~/.tmux/resurrect-inject-claude-session.sh'

run '~/.tmux/plugins/tpm/tpm'

# save-before-quit: reboot -> macOS kills iTerm2 (it does NOT ask apps to quit)
# -> the tmux client dies -> the server (still alive) sees the socket close and
# fires this hook. Measured: save lands ~650ms after the client dies, and the
# real reboot on 2026-07-14 saved at 22:01:45, 21s before the machine went down.
#
# The wrapper is a lock: one hook per client, so two hotkey windows detaching
# together would otherwise write the same save file twice and duplicate entries.
set-hook -g client-detached 'run-shell -b ~/.tmux/resurrect-save-once.sh'
